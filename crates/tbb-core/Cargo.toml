[package]
name = "tbb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri-independent core logic for TBB Workbench: repository inspection, process supervision, logs, diagnostics."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time", "fs"] }
git2 = { version = "0.19", default-features = false }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.31"
ignore = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
yaml-rust2 = "0.9"
similar = "2"
sha2 = "0.10"
obfstr = "0.4.6"

[dev-dependencies]
tempfile = "3"
